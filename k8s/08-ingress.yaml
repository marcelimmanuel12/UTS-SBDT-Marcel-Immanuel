apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sbdt-ingress
  namespace: sbdt-uts
spec:
  ingressClassName: traefik
  rules:
  - host: auth.lokal
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: keycloak
            port:
              number: 8080
  - host: api.lokal
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: api
            port:
              number: 8000
