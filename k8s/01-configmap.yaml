apiVersion: v1
kind: ConfigMap
metadata:
  name: pg-init
  namespace: sbdt-uts
data:
  01-init-primary.sh: "#!/bin/sh\nset -eu\n# Untuk laboratorium lokal; produksi batasi alamat client\
    \ di pg_hba.conf.\nprintf '%s\\n' 'host replication replicator 0.0.0.0/0 scram-sha-256' >> \"\
    $PGDATA/pg_hba.conf\"\npsql -v ON_ERROR_STOP=1 --username \"$POSTGRES_USER\" --dbname \"$POSTGRES_DB\"\
    \ \\\n  -v rep_pass=\"$REPLICATION_PASSWORD\" <<'SQL'\nSELECT format('CREATE ROLE replicator\
    \ WITH REPLICATION LOGIN PASSWORD %L', :'rep_pass') \\gexec\nSQL\n"
  02-schema.sql: "CREATE TABLE IF NOT EXISTS inference_history (\n    id BIGSERIAL PRIMARY KEY,\n\
    \    username TEXT NOT NULL,\n    transaction_amount DOUBLE PRECISION NOT NULL CHECK (transaction_amount\
    \ > 0),\n    transactions_24h INTEGER NOT NULL CHECK (transactions_24h >= 0),\n    new_device\
    \ BOOLEAN NOT NULL,\n    risk_probability DOUBLE PRECISION NOT NULL CHECK (risk_probability BETWEEN\
    \ 0 AND 1),\n    risk_label TEXT NOT NULL CHECK (risk_label IN ('tinggi', 'rendah')),\n    created_at\
    \ TIMESTAMPTZ NOT NULL DEFAULT CURRENT_TIMESTAMP\n);\nCREATE INDEX IF NOT EXISTS idx_inference_user_created\
    \ ON inference_history(username, created_at DESC);\n"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: replica-init
  namespace: sbdt-uts
data:
  start-replica.sh: "#!/bin/sh\nset -eu\n: \"${PGDATA:=/var/lib/postgresql/data/pgdata}\"\n: \"${REPLICATION_PASSWORD:?REPLICATION_PASSWORD\
    \ harus diisi}\"\nmkdir -p \"$PGDATA\"\nchown -R postgres:postgres \"$PGDATA\"\nchmod 700 \"\
    $PGDATA\"\nexport PGPASSWORD=\"$REPLICATION_PASSWORD\"\nif [ ! -s \"$PGDATA/PG_VERSION\" ]; then\n\
    \  echo \"Menunggu primary untuk basebackup...\"\n  until pg_isready -h postgres-primary -p 5432\
    \ -U sbdt >/dev/null 2>&1; do sleep 2; done\n  # pg_basebackup -R menulis standby.signal dan\
    \ primary_conninfo.\n  su-exec postgres pg_basebackup -h postgres-primary -p 5432 -U replicator\
    \ \\\n    -D \"$PGDATA\" -F p -X stream -R -w\nfi\nexec su-exec postgres postgres -D \"$PGDATA\"\
    \ -c hot_standby=on\n"
---
